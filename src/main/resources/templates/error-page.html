<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: topbar('')}"></header>
<main>
    <div class="empty">
        <h2 th:text="${status == 404 ? 'We couldn''t find that page' : 'Something is wrong with this request'}">We couldn't find that page</h2>
        <p th:text="${message}">Book not found with id: 99</p>
        <p><a class="btn" th:href="@{/books}">Go to the catalogue</a></p>
    </div>
</main>
</body>
</html>
