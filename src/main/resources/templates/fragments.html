<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>: fonts + stylesheet (the ?v= parameter makes browsers load the newest CSS) -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' – Library'}">Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css(v=4)}">
</head>

<body>
<!-- Shared top bar; "active" is 'books', 'new' or '' -->
<header class="topbar" th:fragment="topbar(active)">
    <div class="topbar-inner">
        <a class="wordmark" th:href="@{/books}">
            <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
                <rect x="2" y="4" width="5" height="19" rx="1" fill="#2b59c3"/>
                <rect x="8.5" y="2" width="5" height="21" rx="1" fill="#172033"/>
                <rect x="15" y="6" width="5" height="17" rx="1" fill="#2b59c3" transform="rotate(-12 17.5 14.5)"/>
            </svg>
            Library
        </a>
        <nav>
            <a class="nav-link" th:href="@{/books}" th:classappend="${active == 'books'} ? 'active'">Catalogue</a>
            <a class="nav-link" th:href="@{/books/new}" th:classappend="${active == 'new'} ? 'active'">Add a book</a>
            <a class="nav-link" th:href="@{/swagger-ui.html}">API</a>
        </nav>
    </div>
</header>
</body>
</html>
