spring:
  application:
    name: library-api

  # ---- PostgreSQL (default profile) ----
  # Create the database first: CREATE DATABASE library_db;   (or run: docker compose up -d)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  # ---- File upload limits ----
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  # ---- Pagination defaults ----
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

app:
  upload:
    dir: uploads          # uploaded covers are stored physically in ./uploads/covers
  seed-data: true         # insert demo data on first start (only if tables are empty)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

---
# ---- H2 in-memory profile: run without installing a database ----
# Run with:  mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
